<!DOCTYPE html>
<html>
<head>
    <title>Spam Detector</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            overflow: hidden;
            position: relative;
        }

        .texture {
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                115deg,
                transparent 0px,
                transparent 40px,
                rgba(255,255,255,0.015) 40px,
                rgba(255,255,255,0.015) 41px
            );
            z-index: 0;
        }

        .glow {
            position: fixed;
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(255,70,85,0.18), transparent 70%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 5s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.7; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .glow-secondary {
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(61,220,151,0.1), transparent 70%);
            bottom: -100px; right: -100px;
            z-index: 0;
            animation: drift 12s ease-in-out infinite;
        }
        @keyframes drift {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-60px, -40px); }
        }

        /* continuous ambient light beams sweeping in the background */
        .ambient-beam {
            position: fixed;
            top: 0;
            width: 2px;
            height: 100%;
            background: linear-gradient(180deg, transparent, rgba(255,70,85,0.5), transparent);
            transform: skewX(-20deg);
            z-index: 0;
            opacity: 0.5;
        }
        .ambient-beam.b1 { left: 15%; animation: beamMove 7s linear infinite; }
        .ambient-beam.b2 { left: 65%; background: linear-gradient(180deg, transparent, rgba(61,220,151,0.4), transparent); animation: beamMove 9s linear infinite 2s; }
        .ambient-beam.b3 { left: 85%; animation: beamMove 11s linear infinite 4s; }
        @keyframes beamMove {
            0% { transform: skewX(-20deg) translateY(-100%); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: skewX(-20deg) translateY(100%); opacity: 0; }
        }

        /* floating particles */
        .particle {
            position: fixed;
            width: 3px; height: 3px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            z-index: 0;
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 0.6; }
            90% { opacity: 0.6; }
            100% { transform: translateY(-100vh) translateX(20px); opacity: 0; }
        }

        /* rotating scan ring behind the card */
        .scan-ring {
            position: fixed;
            top: 50%; left: 50%;
            width: 640px; height: 640px;
            margin: -320px 0 0 -320px;
            border: 1px solid rgba(255,70,85,0.15);
            border-radius: 50%;
            z-index: 0;
            animation: rotate 20s linear infinite;
        }
        .scan-ring::before {
            content: '';
            position: absolute;
            top: -1px; left: 50%;
            width: 6px; height: 6px;
            background: #ff4655;
            border-radius: 50%;
            box-shadow: 0 0 12px 3px rgba(255,70,85,0.8);
        }
        .scan-ring.two {
            width: 760px; height: 760px;
            margin: -380px 0 0 -380px;
            border-color: rgba(61,220,151,0.1);
            animation: rotate 28s linear infinite reverse;
        }
        .scan-ring.two::before {
            background: #3ddc97;
            box-shadow: 0 0 12px 3px rgba(61,220,151,0.6);
        }
        @keyframes rotate {
            to { transform: rotate(360deg); }
        }

        /* ---- INTRO SEQUENCE ---- */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 20;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.4s ease;
        }
        #splash.hide { opacity: 0; pointer-events: none; }

        .sweep {
            position: absolute;
            top: 0;
            left: -20%;
            width: 8%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #ff4655, transparent);
            transform: skewX(-20deg);
            opacity: 0;
            animation: sweepAcross 1s cubic-bezier(0.7,0,0.3,1) forwards;
        }
        .sweep.two { animation-delay: 0.15s; opacity: 0; }
        @keyframes sweepAcross {
            0% { left: -20%; opacity: 1; }
            80% { opacity: 1; }
            100% { left: 120%; opacity: 0; }
        }

        .splash-content {
            text-align: center;
            opacity: 0;
            animation: revealText 0.5s ease forwards 0.9s;
        }
        @keyframes revealText {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .splash-mark {
            width: 0;
            height: 3px;
            background: #ff4655;
            margin: 0 auto 18px;
            animation: growLine 0.4s ease forwards 1s;
        }
        @keyframes growLine { to { width: 80px; } }

        .splash-title {
            font-family: 'Rajdhani', sans-serif;
            font-size: 34px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 8px;
            text-transform: uppercase;
        }
        .splash-title span { color: #ff4655; }

        .splash-sub {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 8px;
        }

        /* ---- MAIN APP ---- */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 460px;
            padding: 44px 40px 36px;
            background: rgba(18, 18, 24, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.08);
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 24px), calc(100% - 24px) 100%, 0 100%);
            opacity: 0;
        }
        .container.reveal {
            animation: fadeUp 0.6s ease forwards;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 4px; height: 100%;
            background: #ff4655;
            box-shadow: 0 0 12px rgba(255,70,85,0.6);
        }

        .eyebrow {
            font-family: 'Rajdhani', sans-serif;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ff4655;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .eyebrow::before {
            content: '';
            width: 16px; height: 2px;
            background: #ff4655;
        }

        h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 30px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #fff;
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 13.5px;
            color: rgba(255,255,255,0.45);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-family: 'Rajdhani', sans-serif;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.55);
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 110px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            padding: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: #0a0a0f;
            color: #eaeaf0;
            resize: none;
            outline: none;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px));
            transition: border-color 0.2s;
        }
        textarea::placeholder { color: rgba(255,255,255,0.25); }
        textarea:focus { border-color: #ff4655; }

        button {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #fff;
            background: #ff4655;
            border: none;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px));
            cursor: pointer;
            transition: background 0.15s, transform 0.1s;
        }
        button:hover { background: #ff5e6c; }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: default; }

        .result-card {
            margin-top: 20px;
            padding: 16px 18px;
            display: none;
            align-items: center;
            gap: 12px;
            border-left: 3px solid;
            background: rgba(255,255,255,0.03);
            opacity: 0;
        }
        .result-card.show {
            display: flex;
            animation: fadeUp 0.35s ease forwards;
        }

        .result-icon {
            font-family: 'Rajdhani', sans-serif;
            font-size: 20px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .result-label {
            font-family: 'Rajdhani', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .result-confidence { font-size: 12px; color: rgba(255,255,255,0.4); }

        .spam-card { border-color: #ff4655; }
        .spam-card .result-icon, .spam-card .result-label { color: #ff4655; }

        .safe-card { border-color: #3ddc97; }
        .safe-card .result-icon, .safe-card .result-label { color: #3ddc97; }

        .error-text {
            margin-top: 16px;
            font-size: 13px;
            color: #ff4655;
            text-align: center;
        }

        .footer-note {
            margin-top: 26px;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.25);
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="texture"></div>
    <div class="glow"></div>
    <div class="glow-secondary"></div>
    <div class="scan-ring"></div>
    <div class="scan-ring two"></div>
    <div class="ambient-beam b1"></div>
    <div class="ambient-beam b2"></div>
    <div class="ambient-beam b3"></div>
    <div id="particles"></div>

    <div id="splash">
        <div class="sweep"></div>
        <div class="sweep two"></div>
        <div class="splash-content">
            <div class="splash-mark"></div>
            <div class="splash-title">SPAM<span>DETECT</span></div>
            <div class="splash-sub">Initializing model</div>
        </div>
    </div>

    <div class="container" id="mainCard">
        <div class="eyebrow">Model active</div>
        <h1>Spam Detector</h1>
        <p class="subtitle">Paste any message below and the model classifies it as spam or legitimate, with a confidence score.</p>

        <label for="messageInput">Message</label>
        <textarea id="messageInput" placeholder="e.g. Congratulations! You've won a free prize, click here to claim..."></textarea>

        <button id="checkBtn" onclick="checkSpam()">Analyze message</button>

        <div class="result-card" id="resultCard">
            <div class="result-icon" id="resultIcon"></div>
            <div class="result-text">
                <div class="result-label" id="resultLabel"></div>
                <div class="result-confidence" id="resultConfidence"></div>
            </div>
        </div>
        <div class="error-text" id="errorText" style="display:none;"></div>

        <div class="footer-note">Naive Bayes classifier — trained on SMS data</div>
    </div>

    <script>
        // generate floating particles
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.bottom = '-10px';
            p.style.animationDuration = (8 + Math.random() * 10) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            particleContainer.appendChild(p);
        }

        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').classList.add('hide');
                document.getElementById('mainCard').classList.add('reveal');
            }, 1500);
        });

        async function checkSpam() {
            const message = document.getElementById("messageInput").value;
            const btn = document.getElementById("checkBtn");
            const resultCard = document.getElementById("resultCard");
            const errorText = document.getElementById("errorText");

            resultCard.className = "result-card";
            errorText.style.display = "none";

            if (!message.trim()) {
                errorText.textContent = "Please enter a message first.";
                errorText.style.display = "block";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Analyzing...";

            try {
                const response = await fetch("http://localhost:5000/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();

                const isSpam = data.label === "Spam";
                document.getElementById("resultIcon").textContent = isSpam ? "!" : "✓";
                document.getElementById("resultLabel").textContent = isSpam ? "Spam detected" : "Looks legitimate";
                document.getElementById("resultConfidence").textContent = `${data.confidence}% confidence`;
                resultCard.className = "result-card show " + (isSpam ? "spam-card" : "safe-card");
            } catch (err) {
                errorText.textContent = "Couldn't connect to the server. Make sure app.py is running.";
                errorText.style.display = "block";
            } finally {
                btn.disabled = false;
                btn.textContent = "Analyze message";
            }
        }
    </script>
</body>
</html>
